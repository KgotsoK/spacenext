name: Deploy SpaceNext to GitHub Pages

on:
  # Runs on pushes targeting the main branches
  push:
    branches: ["master", "develop"]
    
  # Runs when PRs are merged to these branches
  pull_request:
    types: [closed]
    branches: ["master", "develop"]

  # Allows manual trigger from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'master')
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      
      - name: Post deployment notification
        run: |
          echo "SpaceNext deployed successfully to GitHub Pages"
          echo "Site URL: ${{ steps.deployment.outputs.page_url }}"
      
  # Preview deployment for develop branch
  preview:
    environment:
      name: github-pages-preview
      url: ${{ steps.preview_deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'develop')
    steps:
      - name: Deploy preview to GitHub Pages
        id: preview_deployment
        uses: actions/deploy-pages@v4
        with:
          preview: true
      
      - name: Post preview notification
        run: |
          echo "SpaceNext preview deployed successfully to GitHub Pages"
          echo "Preview URL: ${{ steps.preview_deployment.outputs.page_url }}" 